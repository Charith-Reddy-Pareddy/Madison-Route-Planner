name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Test frontend
        run: npm --prefix frontend test -- --configLoader runner
      - name: Test JavaScript modules and Pages helpers
        run: node --test frontend/*.test.mjs test/frontend-syntax.test.mjs test/report-outline.test.mjs
      - name: Build GitHub Pages site
        run: scripts/build-pages.sh "$RUNNER_TEMP/madison-route-planner-site"
      - name: Check Pages artifact
        env:
          PAGES_DIR: ${{ runner.temp }}/madison-route-planner-site
        run: node --test test/pages-artifact.test.mjs

  backend:
    name: Java checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Java backend
        run: mvn --batch-mode test
